name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Layout (mirrors echo-ai-c's CI split; see AGENTS.md "Environment and
# toolchain" and "Build flags"):
# - backend-debian runs the whole gate with a plain rustup toolchain
#   inside a debian:trixie container. GitHub has no hosted Debian runners,
#   so the container *is* the Debian environment — the same trick as the
#   C project's debian:sid containers (C pins sid because notcurses was
#   dropped from trixie's archive; this repo has no such dependency, so
#   trixie works here). Stable 1.98.0 comes from rust-toolchain.toml via
#   dtolnay/rust-toolchain; nightly 2026-08-25 (must match flake.nix's
#   pin) supplies the sanitizer/Miri components.
# - backend-nix runs the same gate via `nix develop`; flake.lock pins
#   both toolchains, and `rustup show` records what actually ran.
# - backend-macos is the sanctioned non-Nix path (rustup +
#   rust-toolchain.toml); macOS sets ASAN_OPTIONS=detect_leaks=0 since
#   LeakSanitizer is unsupported there.
# - Sanitizers (ASan/UBSan/TSan) run one stage at a time (not combinable
#   in one build) on the pinned nightly with -Z build-std, in both Linux
#   jobs. Miri runs on the same nightly against echo-ai-core.

env:
  CARGO_TERM_COLOR: always

jobs:
  backend-debian:
    runs-on: ubuntu-latest
    container: debian:trixie-slim

    steps:
    # git must exist before checkout (actions/checkout runs inside the
    # container), and the workspace mount is owned by the host runner UID
    # — every later git invocation fails with "detected dubious ownership"
    # unless the path is marked safe.
    - name: install base deps
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git ca-certificates curl build-essential pkg-config python3
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: actions/checkout@v4

    # Stable 1.98.0 + components must be explicit: dtolnay/rust-toolchain
    # no longer auto-reads rust-toolchain.toml and fails on an empty
    # `toolchain` input.
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.98.0
        components: clippy, rustfmt, rust-src, llvm-tools-preview

    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest,cargo-audit,cargo-deny

    # Nightly install is plain rustup (deterministic; dtolnay's
    # multi-toolchain component semantics are unclear) and shares the
    # traceability step. Pin must match flake.nix.
    - name: install nightly (flake pin) + record toolchain
      run: |
        rustup toolchain install nightly-2026-08-25 --profile minimal --component rust-src,llvm-tools-preview,miri
        rustup show
        rustc --version && cargo --version
        rustc +nightly-2026-08-25 --version

    - name: fmt
      run: cargo fmt --all -- --check

    - name: clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: build (-D warnings)
      run: RUSTFLAGS="-D warnings" cargo build --all-targets --locked

    - name: doc (-D warnings)
      run: RUSTDOCFLAGS="-D warnings" cargo doc --document-private-items --locked

    - name: nextest
      run: cargo nextest run --all --locked

    - name: file-size audit (non-blocking)
      run: scripts/check-file-lengths.sh

    - name: cargo audit
      run: cargo audit

    - name: cargo deny
      # --locked is a global flag in current cargo-deny (0.20.x); it must
      # precede the subcommand or the run fails with "unexpected argument".
      run: cargo deny --locked check

    # One stage per sanitizer; -Z build-std needs the rust-src component.
    - name: test under ASan
      run: |
        set -euo pipefail
        export RUSTFLAGS="-Z sanitizer=address -D warnings"
        export ASAN_OPTIONS=detect_leaks=0
        cargo +nightly-2026-08-25 test -Z build-std --target x86_64-unknown-linux-gnu --all --locked

    - name: test under UBSan
      run: |
        set -euo pipefail
        export RUSTFLAGS="-Z sanitizer=undefined -D warnings"
        cargo +nightly-2026-08-25 test -Z build-std --target x86_64-unknown-linux-gnu --all --locked

    - name: test under TSan
      run: |
        set -euo pipefail
        export RUSTFLAGS="-Z sanitizer=thread -D warnings"
        cargo +nightly-2026-08-25 test -Z build-std --target x86_64-unknown-linux-gnu --all --locked

    - name: miri setup (build sysroot)
      run: cargo +nightly-2026-08-25 miri setup

    - name: miri test (echo-ai-core)
      # -Zmiri-disable-isolation: tests read the wall clock (message
      # timestamps, Fernet freshness); Miri's default isolation blocks
      # clock_gettime(REALTIME).
      # --skip: rusqlite is bundled C FFI and subprocess tests need
      # real pipes/socketpairs — neither is Miri-interpretable; the
      # session store and process runner are covered by the sanitizer
      # stages instead.
      # Quoted: plain YAML scalars cannot contain ": " (the --skip
      # values end in "::").
      run: 'MIRIFLAGS="-Zmiri-disable-isolation" cargo +nightly-2026-08-25 miri test -p echo-ai-core --all-features --locked -- --skip session:: --skip tools::git:: --skip tools::shell:: --skip tools::process::'

    - name: setup node (frontend)
      # The vendored React frontend: install, typecheck, build dist
      # (the server serves frontend/dist; CI's artifact is not
      # committed since dist is gitignored). setup-node installs node
      # into the container; the exact minor/patch is pinned by the
      # committed package-lock.json (npm ci).
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: frontend build + typecheck
      run: |
        cd frontend
        npm ci --no-audit --no-fund
        npm run typecheck
        npm run build
        test -f dist/index.html

  backend-nix:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: DeterminateSystems/nix-installer-action@v16
    - uses: DeterminateSystems/magic-nix-cache-action@v9

    - name: record toolchain
      run: nix develop -c bash -c 'rustup show; rustc --version; cargo --version; rustc +nightly --version'

    - name: fmt
      run: nix develop -c cargo fmt --all -- --check

    - name: clippy
      run: nix develop -c cargo clippy --all-targets --all-features -- -D warnings

    - name: build (-D warnings)
      run: nix develop -c bash -c 'RUSTFLAGS="-D warnings" cargo build --all-targets --locked'

    - name: doc (-D warnings)
      run: nix develop -c bash -c 'RUSTDOCFLAGS="-D warnings" cargo doc --document-private-items --locked'

    - name: nextest
      run: nix develop -c cargo nextest run --all --locked

    - name: file-size audit (non-blocking)
      run: nix develop -c scripts/check-file-lengths.sh

    - name: cargo audit
      run: nix develop -c cargo audit

    - name: cargo deny
      # Same global-flag ordering as backend-debian.
      run: nix develop -c cargo deny --locked check

    # One stage per sanitizer (ASan/UBSan/TSan), separate from the lint/test
    # run; the dev shell's rustup shim resolves +nightly to the flake pin.
    - name: test under ASan
      run: |
        nix develop -c bash -c '
          set -euo pipefail
          export RUSTFLAGS="-Z sanitizer=address -D warnings"
          export ASAN_OPTIONS=detect_leaks=0
          cargo +nightly test -Z build-std --target x86_64-unknown-linux-gnu --all --locked
        '

    - name: test under UBSan
      run: |
        nix develop -c bash -c '
          set -euo pipefail
          export RUSTFLAGS="-Z sanitizer=undefined -D warnings"
          cargo +nightly test -Z build-std --target x86_64-unknown-linux-gnu --all --locked
        '

    - name: test under TSan
      run: |
        nix develop -c bash -c '
          set -euo pipefail
          export RUSTFLAGS="-Z sanitizer=thread -D warnings"
          cargo +nightly test -Z build-std --target x86_64-unknown-linux-gnu --all --locked
        '

    - name: miri test (echo-ai-core)
      # Same --skip rationale as backend-debian; quoted for the same
      # plain-scalar ": " reason.
      run: "nix develop -c bash -c 'MIRIFLAGS=\"-Zmiri-disable-isolation\" cargo +nightly miri test -p echo-ai-core --all-features --locked -- --skip session:: --skip tools::git:: --skip tools::shell:: --skip tools::process::'"

    - name: frontend build + typecheck
      # nodejs_22 is part of the dev shell, so the frontend builds inside
      # nix develop; dist stays gitignored.
      run: nix develop -c bash -c 'cd frontend && npm ci --no-audit --no-fund && npm run typecheck && npm run build && test -f dist/index.html'

  backend-macos:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@master # explicit; see backend-debian for why
      with:
        toolchain: 1.98.0
        components: clippy, rustfmt, rust-src, llvm-tools-preview
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: record toolchain
      run: rustup show && rustc --version && cargo --version

    - name: fmt
      run: cargo fmt --all -- --check

    - name: clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: build (-D warnings)
      run: RUSTFLAGS="-D warnings" cargo build --all-targets --locked

    - name: nextest
      env:
        ASAN_OPTIONS: detect_leaks=0
      run: cargo nextest run --all --locked